aid: convergent-dental
name: Convergent Dental
description: 'Convergent Dental, Inc. is a privately held dental equipment and technology
  manufacturer headquartered in Waltham, Massachusetts, best known for Solea, a 9.3
  micron CO2 all-tissue dental laser cleared by the FDA for hard tissue, soft tissue
  and osseous indications. The Solea platform is marketed for anesthesia-free, blood-free
  and suture-free restorative, soft tissue, pediatric, implant and cosmetic procedures,
  and has been extended with Solea Perioguide for minimally invasive periodontal therapy,
  Solea Sleep and Solea Protect. The company sells and services through its own commercial
  organization and a distribution partnership with Patterson Dental, and supports clinicians
  with training and education, clinical studies, case studies and the annual Solea
  Summit. Convergent Dental publishes no public developer program, API documentation,
  machine-readable API contract or agent surface as of this profiling pass.'
